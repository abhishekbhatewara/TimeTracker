# Keeps the Time Tracker's free-tier Supabase project from auto-pausing.
# Supabase pauses free projects after about a week with no activity, and a paused
# project breaks login with "Failed to fetch". This makes one small read a day.
# If the project is already paused, the run fails, so GitHub emails a failure.
# (Source copy lives in ~/Claude-Projects/time-align/.github/workflows/.)
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 3 * * *"   # daily at 08:47 IST
  workflow_dispatch:

permissions:
  actions: write   # lets the last step re-enable this schedule (see below)
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row from the database
        run: |
          # Uses the public browser key that ships in config.js (not a secret).
          code=$(curl -s -o /dev/null -w "%{http_code}" -m 30 \
            "https://mrrlfovbwmyspggrahbf.supabase.co/rest/v1/areas?select=id&limit=1" \
            -H "apikey: sb_publishable_pmIT0L0tHRCzQi0GzQMJ2Q_uSMyF6F_")
          echo "Supabase answered HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Supabase did not answer (HTTP $code). If it says paused, restore it: supabase.com/dashboard/project/mrrlfovbwmyspggrahbf"
            exit 1
          fi
      - name: Stop GitHub switching this schedule off
        # GitHub disables scheduled workflows in repos with no commits for 60 days;
        # re-enabling it on every run keeps it alive between app deploys.
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
